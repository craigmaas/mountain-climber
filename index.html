<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Don't Look Down</title>
<style>
  body {
    margin: 0;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
  }
  h1 { margin: 6px 0 2px; font-size: 22px; }
  p { margin: 0 0 6px; color: #bbb; font-size: 13px; }
  canvas { border: 4px solid #333; border-radius: 8px; display: block; }
</style>
</head>
<body>
<h1>Don't Look Down</h1>
<p>Arrow keys or A / D to move &nbsp;•&nbsp; Space or Up to jump (press again in the air to double jump!) &nbsp;•&nbsp; R to go back to your checkpoint</p>
<canvas id="game" width="800" height="600"></canvas>

<script>
// ============================================================
//  SETTINGS - change these numbers to change how the game feels!
// ============================================================
const GRAVITY = 0.6;            // how fast you fall
const JUMP_POWER = 13;          // how high you jump
const DOUBLE_JUMP = true;       // can you jump again in the air?
const DOUBLE_JUMP_POWER = 11;   // how high the second jump goes
const RUN_SPEED = 4;            // how fast you run
const BOUNCE_POWER = 21;        // how high bouncy platforms throw you
const NUMBER_OF_PLATFORMS = 80; // how many platforms to the top
const CHECKPOINT_EVERY = 10;    // a checkpoint every this many platforms
const PLAYER_COLOR = '#ff8c42'; // the color of your climber's jacket
const LEVEL_NUMBER = 1;         // change this to get a brand new tower!
const WORLD_WIDTH = 2400;       // how wide the world is (the screen shows 800 at a time)

// The tower is split into zones. Each zone looks different.
const ZONES = [
  { name: 'The Meadow',    sky: '#87ceeb' },
  { name: 'The Mountains', sky: '#6a9bd1' },
  { name: 'The Icy Peaks', sky: '#cfe8f7' },
  { name: 'Outer Space',   sky: '#0b0b3b' },
];

// A "random" number maker that gives the same numbers for the same level number
let seed = LEVEL_NUMBER * 9999 + 12345;
function random() {
  seed = (seed * 1664525 + 1013904223) % 4294967296;
  return seed / 4294967296;
}

// ============================================================
//  SETUP
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// Make the game as big as the browser window allows (keeps the same shape)
function fitToWindow() {
  const spaceForText = 70;
  const maxWidth = window.innerWidth - 20;
  const maxHeight = window.innerHeight - spaceForText;
  let width = maxWidth;
  let height = width * (H / W);
  if (height > maxHeight) {
    height = maxHeight;
    width = height * (W / H);
  }
  canvas.style.width = Math.floor(width) + 'px';
  canvas.style.height = Math.floor(height) + 'px';
}
fitToWindow();
window.addEventListener('resize', fitToWindow);
const GROUND_Y = 500; // where the ground is

// Keyboard
const keys = {};
let jumpPressed = false;
let started = false;

window.addEventListener('keydown', function (e) {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  if (!keys[e.key] && (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W')) {
    jumpPressed = true;
  }
  keys[e.key] = true;
  if (e.key === 'r' || e.key === 'R') respawn();
  started = true;
});
window.addEventListener('keyup', function (e) { keys[e.key] = false; });

// ============================================================
//  BUILD THE PLATFORMS (the tower you climb)
// ============================================================
// Kinds of platforms:
//   normal   - just stand on it
//   moving   - slides left and right, and carries you along
//   crumble  - breaks apart shortly after you land on it
//   bouncy   - throws you way up high
//   ice      - super slippery!
//   checkpoint / summit - where you save your spot / the goal
const platforms = [];
platforms.push({ x: 0, y: GROUND_Y, w: WORLD_WIDTH, h: 100, type: 'ground', number: 0, zone: 0 });

let lastCenter = WORLD_WIDTH / 2;
let driftDir = 1; // which way the path is heading: 1 = right, -1 = left
let lastWidth = W;
let lastY = GROUND_Y;
let lastType = 'ground';
for (let i = 1; i <= NUMBER_OF_PLATFORMS; i++) {
  const difficulty = i / NUMBER_OF_PLATFORMS; // 0 at the bottom, 1 at the top
  const zone = Math.min(ZONES.length - 1, Math.floor(i / (NUMBER_OF_PLATFORMS / ZONES.length)));
  const isSummit = i === NUMBER_OF_PLATFORMS;
  const isCheckpoint = !isSummit && i % CHECKPOINT_EVERY === 0;

  // Decide what kind of platform this is. Higher up = more tricky ones.
  let type = 'normal';
  if (isSummit) type = 'summit';
  else if (isCheckpoint) type = 'checkpoint';
  else {
    const specialChance = 0.15 + 0.45 * difficulty;
    if (random() < specialChance) {
      const pick = random();
      if (pick < 0.3) type = 'moving';
      else if (pick < 0.55) type = 'crumble';
      else if (pick < 0.75 && lastType !== 'bouncy' && (i + 1) % CHECKPOINT_EVERY !== 0) type = 'bouncy';
      else type = 'ice';
    }
    if (zone === 2 && type === 'normal' && random() < 0.5) type = 'ice';
  }

  // Platforms get smaller as you go up
  let w;
  if (isSummit) w = 260;
  else if (isCheckpoint) w = 180;
  else if (type === 'bouncy') w = 50 + random() * 20; // bouncy ones are tiny
  else w = (90 - 30 * difficulty) + random() * (80 - 40 * difficulty);

  let cx, y;
  if (type === 'bouncy') {
    // Bouncy platforms are a long, tricky jump away
    const wantedGap = 95 + random() * 15;
    let direction = random() < 0.5 ? -1 : 1;
    cx = lastCenter + direction * (wantedGap + w / 2 + lastWidth / 2);
    if (cx < w / 2 + 10 || cx > WORLD_WIDTH - w / 2 - 10) {
      direction = -direction;
      cx = lastCenter + direction * (wantedGap + w / 2 + lastWidth / 2);
    }
    cx = Math.max(w / 2 + 10, Math.min(WORLD_WIDTH - w / 2 - 10, cx));
    y = lastY - (95 + 10 * difficulty) + (random() * 10 - 5);
  } else if (lastType === 'bouncy') {
    // After a bouncy platform you fly way up, so the next one is far above
    const maxGap = 160;
    cx = lastCenter + (random() * 2 - 1) * 320;
    cx = Math.max(w / 2 + 10, Math.min(WORLD_WIDTH - w / 2 - 10, cx));
    const gap = Math.abs(cx - lastCenter) - w / 2 - lastWidth / 2;
    if (gap > maxGap) {
      const direction = cx > lastCenter ? 1 : -1;
      cx = lastCenter + direction * (maxGap + w / 2 + lastWidth / 2);
      cx = Math.max(w / 2 + 10, Math.min(WORLD_WIDTH - w / 2 - 10, cx));
    }
    y = lastY - (220 + random() * 40);
  } else {
    // The path wanders left and right across the world
    if (random() < 0.12) driftDir = -driftDir;                       // sometimes it turns around
    if (lastCenter < 200) driftDir = 1;                              // bounce off the left edge
    if (lastCenter > WORLD_WIDTH - 200) driftDir = -1;               // bounce off the right edge
    const sideways = random() < 0.3;                                 // a flat sideways stretch?

    // Gaps get bigger as you go up, but never too big to jump
    const maxGap = (sideways ? 90 : 55) + 40 * difficulty;
    cx = lastCenter + driftDir * (30 + random() * (150 + 100 * difficulty));
    cx = Math.max(w / 2 + 10, Math.min(WORLD_WIDTH - w / 2 - 10, cx));
    const gap = Math.abs(cx - lastCenter) - w / 2 - lastWidth / 2;
    if (gap > maxGap) {
      const direction = cx > lastCenter ? 1 : -1;
      cx = lastCenter + direction * (maxGap + w / 2 + lastWidth / 2);
      cx = Math.max(w / 2 + 10, Math.min(WORLD_WIDTH - w / 2 - 10, cx));
    }
    if (sideways) y = lastY - (25 + random() * 25);
    else y = lastY - (80 + 20 * difficulty) + (random() * 20 - 10);
  }

  const p = {
    x: cx - w / 2, y: y, w: w, h: 18, type: type, number: i, zone: zone,
    vx: 0, minX: 0, maxX: 0,          // for moving platforms
    crumbleTimer: 0, broken: false, respawnTimer: 0, // for crumble platforms
    squish: 0,                        // for bouncy platforms
  };
  if (type === 'moving') {
    p.vx = (random() < 0.5 ? -1 : 1) * (1 + 1.5 * difficulty);
    const range = 60 + random() * 60;
    p.minX = Math.max(0, p.x - range);
    p.maxX = Math.min(WORLD_WIDTH - w, p.x + range);
  }
  platforms.push(p);

  lastCenter = cx;
  lastWidth = w;
  lastY = y;
  lastType = type;
}
const TOWER_HEIGHT = GROUND_Y - lastY;

// ============================================================
//  OBSTACLES - bears, goats, birds and aliens!
// ============================================================
//   bear  - slow and big. Touch one and it chases you back to your checkpoint!
//   goat  - trots back and forth and headbutts you off the platform
//   bird  - swoops back and forth in the air
//   alien - hovers in a flying saucer and zaps you
// You can bonk goats, birds and aliens by jumping on top of them.
const enemies = [];

function makeEnemy(type, p) {
  const e = { type: type, platform: p, dead: false, respawnTimer: 0, facing: 1, phase: random() * 6 };
  if (type === 'bear')  { e.w = 44; e.h = 34; e.speed = 0.6; }
  if (type === 'goat')  { e.w = 30; e.h = 24; e.speed = 1.2 + random(); }
  if (type === 'bird')  { e.w = 26; e.h = 16; e.speed = 1.5 + random() * 1.5; }
  if (type === 'alien') { e.w = 28; e.h = 28; e.speed = 1 + random(); }
  resetEnemy(e);
  return e;
}

function resetEnemy(e) {
  const p = e.platform;
  e.dead = false;
  e.vx = e.speed * (Math.random() < 0.5 ? -1 : 1);
  if (e.type === 'bird' || e.type === 'alien') {
    // flying ones patrol a bit past both ends of their platform
    e.minX = Math.max(0, p.x - 120);
    e.maxX = Math.min(WORLD_WIDTH - e.w, p.x + p.w + 120);
    e.baseY = p.y - (e.type === 'alien' ? 95 : 70);
    e.x = p.x + p.w / 2 - e.w / 2;
    e.y = e.baseY;
  } else {
    // walking ones stay on their platform
    e.minX = p.x;
    e.maxX = p.x + p.w - e.w;
    e.x = Math.min(e.maxX, Math.max(e.minX, p.x + p.w / 2 - e.w / 2));
    e.y = p.y - e.h;
  }
}

for (const p of platforms) {
  if (p.number < 4 || p.type !== 'normal') continue;
  const difficulty = p.number / NUMBER_OF_PLATFORMS;
  const roll = random();
  if (p.zone === 0 && p.w >= 110 && roll < 0.22) {
    enemies.push(makeEnemy('bear', p));
  } else if ((p.zone === 1 || p.zone === 2) && p.w >= 80 && roll < 0.25 + 0.1 * difficulty) {
    enemies.push(makeEnemy('goat', p));
  } else if ((p.zone === 1 || p.zone === 2) && roll < 0.45 + 0.1 * difficulty) {
    enemies.push(makeEnemy('bird', p));
  } else if (p.zone === 3 && roll < 0.35) {
    enemies.push(makeEnemy('alien', p));
  }
}

function updateEnemies(oldBottom, newBottom) {
  if (player.hurtTimer > 0) player.hurtTimer--;

  for (const e of enemies) {
    if (e.dead) {
      e.respawnTimer--;
      if (e.respawnTimer <= 0) resetEnemy(e);
      continue;
    }

    // move back and forth
    e.x += e.vx;
    if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); }
    if (e.x > e.maxX) { e.x = e.maxX; e.vx = -Math.abs(e.vx); }
    e.facing = e.vx >= 0 ? 1 : -1;
    if (e.type === 'bird') e.y = e.baseY + Math.sin(frames * 0.08 + e.phase) * 8;
    if (e.type === 'alien') e.y = e.baseY + Math.sin(frames * 0.04 + e.phase) * 15;

    // are we touching it?
    const pad = 4;
    const touching =
      player.x + pad < e.x + e.w && player.x + player.w - pad > e.x &&
      player.y + pad < e.y + e.h && player.y + player.h > e.y;
    if (!touching) continue;

    // jumping on top of it?
    const stomp = player.vy > 0 && oldBottom <= e.y + 10 && e.type !== 'bear';
    if (stomp) {
      e.dead = true;
      e.respawnTimer = 600;
      player.y = e.y - player.h;
      player.vy = -9;
      player.jumpsUsed = 1;
      showMessage('Bonk!');
      continue;
    }

    if (player.hurtTimer > 0) continue; // you are safe for a moment after a hit

    if (e.type === 'bear') {
      respawn();
      showMessage('A bear chased you back to your checkpoint!');
      continue;
    }

    // knocked back!
    const dir = (player.x + player.w / 2) < (e.x + e.w / 2) ? -1 : 1;
    player.vx = dir * (e.type === 'bird' ? 6 : 8);
    player.vy = e.type === 'bird' ? -5 : -7;
    player.knockTimer = 18;
    player.hurtTimer = 60;
    player.jumpsUsed = 1;
    player.onGround = false;
    player.standingOn = null;
    if (e.type === 'goat') showMessage('Bonk! A goat headbutted you!');
    else if (e.type === 'bird') showMessage('A bird swooped at you!');
    else showMessage('Zap! An alien bumped you!');
  }
}

function drawEnemies() {
  for (const e of enemies) {
    if (e.dead) continue;
    const sx = e.x - cameraX;
    const sy = e.y - cameraY;
    if (sx + e.w < -20 || sx > W + 20 || sy + e.h < -20 || sy > H + 20) continue;

    ctx.save();
    ctx.translate(sx + e.w / 2, sy); // middle-top of the creature
    ctx.scale(e.facing, 1);          // face the way it is walking
    const legSwing = Math.sin(frames * 0.25 + e.phase) * 3;

    if (e.type === 'goat') {
      ctx.fillStyle = '#9e9e9e'; // legs
      ctx.fillRect(-11 + legSwing, 18, 4, 6);
      ctx.fillRect(-4 - legSwing, 18, 4, 6);
      ctx.fillRect(3 + legSwing, 18, 4, 6);
      ctx.fillStyle = '#f5f5f5'; // body
      ctx.beginPath(); ctx.roundRect(-14, 8, 24, 12, 5); ctx.fill();
      ctx.beginPath(); ctx.roundRect(5, 2, 10, 11, 4); ctx.fill(); // head
      ctx.fillRect(12, 12, 3, 5); // beard
      ctx.fillStyle = '#8d6e63'; // horns
      ctx.beginPath(); ctx.moveTo(6, 3); ctx.lineTo(3, -4); ctx.lineTo(9, 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(11, 3); ctx.lineTo(10, -4); ctx.lineTo(14, 2); ctx.fill();
      ctx.fillStyle = '#222'; // eye
      ctx.fillRect(11, 5, 2, 2);

    } else if (e.type === 'bear') {
      ctx.fillStyle = '#5d4037'; // legs
      ctx.fillRect(-18 + legSwing, 26, 8, 8);
      ctx.fillRect(-6 - legSwing, 26, 8, 8);
      ctx.fillRect(6 + legSwing, 26, 8, 8);
      ctx.fillStyle = '#795548'; // body
      ctx.beginPath(); ctx.roundRect(-22, 8, 40, 20, 9); ctx.fill();
      ctx.beginPath(); ctx.arc(12, 10, 10, 0, Math.PI * 2); ctx.fill(); // head
      ctx.beginPath(); ctx.arc(6, 2, 4, 0, Math.PI * 2); ctx.arc(17, 2, 4, 0, Math.PI * 2); ctx.fill(); // ears
      ctx.fillStyle = '#d7ccc8'; // snout
      ctx.beginPath(); ctx.arc(19, 13, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(21, 12, 2, 0, Math.PI * 2); ctx.fill(); // nose
      ctx.fillRect(13, 7, 2, 2); // eye

    } else if (e.type === 'bird') {
      const flap = Math.sin(frames * 0.3 + e.phase) * 7;
      ctx.fillStyle = '#37474f'; // wings
      ctx.beginPath(); ctx.moveTo(-6, 8); ctx.lineTo(-14, 8 - flap); ctx.lineTo(2, 8); ctx.fill();
      ctx.fillStyle = '#546e7a'; // body
      ctx.beginPath(); ctx.ellipse(0, 9, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(8, 5, 5, 0, Math.PI * 2); ctx.fill(); // head
      ctx.fillStyle = '#ff9800'; // beak
      ctx.beginPath(); ctx.moveTo(12, 4); ctx.lineTo(18, 6); ctx.lineTo(12, 8); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(9, 4, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(9.5, 4, 1, 0, Math.PI * 2); ctx.fill();

    } else if (e.type === 'alien') {
      ctx.fillStyle = '#90a4ae'; // saucer
      ctx.beginPath(); ctx.ellipse(0, 23, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffeb3b'; // saucer lights
      for (let i = -8; i <= 8; i += 8) { ctx.beginPath(); ctx.arc(i, 24, 1.5, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#66bb6a'; // alien
      ctx.beginPath(); ctx.arc(0, 12, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222'; // big eyes
      ctx.beginPath(); ctx.ellipse(-3, 11, 2.5, 3.5, 0, 0, Math.PI * 2); ctx.ellipse(4, 11, 2.5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#66bb6a'; // antenna
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 3); ctx.lineTo(0, -3); ctx.stroke();
      ctx.fillStyle = '#ff4081';
      ctx.beginPath(); ctx.arc(0, -4, 2.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  ctx.lineWidth = 1;
}

// ============================================================
//  BACKGROUND SCENERY (different in every zone)
// ============================================================
// Where each zone starts and ends (remember: higher up = smaller y)
const zoneTop = [];
const zoneBottom = [];
for (const p of platforms) {
  if (zoneTop[p.zone] === undefined || p.y < zoneTop[p.zone]) zoneTop[p.zone] = p.y;
  if (zoneBottom[p.zone] === undefined || p.y > zoneBottom[p.zone]) zoneBottom[p.zone] = p.y;
}
// The line between one zone and the next
const boundaries = [];
for (let z = 0; z < ZONES.length - 1; z++) boundaries.push((zoneTop[z] + zoneBottom[z + 1]) / 2);

// Which zone is a height in?
function zoneAt(y) {
  let z = 0;
  while (z < boundaries.length && y < boundaries[z]) z++;
  return z;
}

// How strongly should zone z's scenery show at height y? (1 = fully, 0 = not at all)
const BLEND = 250;
function zoneStrength(z, y) {
  const topEdge = z === 0 ? 999999 : boundaries[z - 1];      // bottom of zone (bigger y)
  const bottomEdge = z === boundaries.length ? -999999 : boundaries[z]; // top of zone (smaller y)
  let outside = 0;
  if (y > topEdge) outside = y - topEdge;
  if (y < bottomEdge) outside = bottomEdge - y;
  return Math.max(0, 1 - outside / BLEND);
}

function skyColorAt(y) {
  const z = zoneAt(y);
  if (z < boundaries.length) {
    const dist = y - boundaries[z];
    if (dist < BLEND) return mixColor(ZONES[z].sky, ZONES[z + 1].sky, 0.5 * (1 - dist / BLEND));
  }
  if (z > 0) {
    const dist = boundaries[z - 1] - y;
    if (dist < BLEND) return mixColor(ZONES[z - 1].sky, ZONES[z].sky, 0.5 + 0.5 * dist / BLEND);
  }
  return ZONES[z].sky;
}

// Far-away scenery moves slower than the platforms. That is called "parallax".
// This picks a spot for a decoration so it shows up while you are in that zone.
function spotInZone(z, parallax) {
  const camMin = zoneTop[z] - H * 0.55;
  const camMax = Math.min(GROUND_Y + 100 - H, zoneBottom[z] - H * 0.55);
  return parallax * camMin + random() * (parallax * (camMax - camMin) + H);
}

// Picks a sideways spot for far-away scenery that scrolls at a given speed
function spreadAcross(parallax) {
  return random() * (parallax * (WORLD_WIDTH - W) + W);
}

const clouds = [];
for (let i = 0; i < 120; i++) {
  const z = Math.floor(random() * 3); // clouds in the first three zones
  clouds.push({ x: spreadAcross(0.6), py: spotInZone(z, 0.6), size: 30 + random() * 40 });
}
const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({ x: random() * W, y: random() * H, size: 1 + random() * 2, twinkle: random() * 6 });
}
// Meadow
const hills = [];
const hillColors = ['#4caf50', '#43a047', '#388e3c'];
for (let i = 0; i < 9; i++) {
  hills.push({ x: spreadAcross(0.8), py: 540 + random() * 60, r: 180 + random() * 90, color: hillColors[i % 3] });
}
const trees = [];
for (let i = 0; i < 60; i++) {
  trees.push({ x: spreadAcross(0.5), py: spotInZone(0, 0.5), size: 20 + random() * 25 });
}
// Mountains
const farMountains = [];
for (let i = 0; i < 28; i++) {
  farMountains.push({ x: spreadAcross(0.3), py: spotInZone(1, 0.3), w: 250 + random() * 250, h: 180 + random() * 200 });
}
const nearMountains = [];
for (let i = 0; i < 22; i++) {
  nearMountains.push({ x: spreadAcross(0.5), py: spotInZone(1, 0.5), w: 180 + random() * 200, h: 150 + random() * 150 });
}
const birds = [];
for (let i = 0; i < 7; i++) {
  birds.push({ x: random() * W, y: 60 + random() * 400, speed: 0.6 + random() * 0.8, flap: random() * 6 });
}
// Icy Peaks
const snowyPeaks = [];
for (let i = 0; i < 30; i++) {
  snowyPeaks.push({ x: spreadAcross(0.4), py: spotInZone(2, 0.4), w: 200 + random() * 200, h: 200 + random() * 200 });
}
const snowflakes = [];
for (let i = 0; i < 90; i++) {
  snowflakes.push({ x: random() * W, y: random() * H, speed: 0.7 + random() * 1.3, wobble: random() * 6, size: 1.5 + random() * 2 });
}
// Outer Space
const moon = { x: spreadAcross(0.2), py: spotInZone(3, 0.2), r: 70 };
const planet = { x: spreadAcross(0.3), py: spotInZone(3, 0.3), r: 45 };
const rocket = { x: -100, y: 250, speed: 1.2 };

// ============================================================
//  THE PLAYER
// ============================================================
const player = { x: WORLD_WIDTH / 2 - 16, y: GROUND_Y - 40, w: 32, h: 40, vx: 0, vy: 0, onGround: false, coyote: 0, facing: 1, standingOn: null, knockTimer: 0, hurtTimer: 0, jumpsUsed: 0 };
let checkpoint = { x: player.x, y: player.y, number: 0 };
let cameraY = GROUND_Y + 100 - H;
let cameraX = WORLD_WIDTH / 2 - W / 2;
let bestHeight = 0;
let currentZone = 0;
let won = false;
let frames = 0;       // counts time while you play
let finishFrames = 0; // how long it took you to reach the top
let message = '';
let messageTimer = 0;

// Puffs of dust that appear when you double jump
const puffs = [];
function makePuffs() {
  for (let i = 0; i < 8; i++) {
    puffs.push({
      x: player.x + player.w / 2, y: player.y + player.h,
      vx: (Math.random() - 0.5) * 4, vy: Math.random() * 1.5 + 0.5,
      size: 3 + Math.random() * 4, life: 20,
    });
  }
}

function showMessage(text) {
  message = text;
  messageTimer = 150;
}

function respawn() {
  player.x = checkpoint.x;
  player.y = checkpoint.y;
  player.vx = 0;
  player.vy = 0;
  player.standingOn = null;
  player.knockTimer = 0;
  player.hurtTimer = 30;
  showMessage('Back to your checkpoint!');
}

function formatTime(f) {
  const totalSeconds = Math.floor(f / 60);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
}

// ============================================================
//  UPDATE - runs 60 times every second
// ============================================================
function update() {
  frames++;

  // --- Platforms do their thing ---
  for (const p of platforms) {
    if (p.type === 'moving') {
      p.x += p.vx;
      if (p.x < p.minX) { p.x = p.minX; p.vx = -p.vx; }
      if (p.x > p.maxX) { p.x = p.maxX; p.vx = -p.vx; }
    }
    if (p.type === 'crumble') {
      if (p.broken) {
        p.respawnTimer--;
        if (p.respawnTimer <= 0) { p.broken = false; p.crumbleTimer = 0; }
      } else if (p.crumbleTimer > 0) {
        p.crumbleTimer++;
        if (p.crumbleTimer > 35) { p.broken = true; p.respawnTimer = 180; }
      }
    }
    if (p.squish > 0) p.squish--;
  }

  // --- Running left and right ---
  let move = 0;
  if (keys.ArrowLeft || keys.a || keys.A) move -= 1;
  if (keys.ArrowRight || keys.d || keys.D) move += 1;
  if (move !== 0) player.facing = move;

  const onIce = player.standingOn && player.standingOn.type === 'ice';
  if (player.knockTimer > 0) {
    // you got bonked! you cannot steer for a moment
    player.knockTimer--;
    player.vx *= 0.96;
  } else if (onIce) {
    // slippery: you speed up slowly and keep sliding
    player.vx += move * 0.35;
    player.vx *= 0.96;
    const maxSlide = RUN_SPEED * 1.4;
    if (player.vx > maxSlide) player.vx = maxSlide;
    if (player.vx < -maxSlide) player.vx = -maxSlide;
  } else if (move !== 0 || player.onGround) {
    player.vx = move * RUN_SPEED;
  } else {
    player.vx *= 0.9; // in the air with no key pressed: slow down gently
  }

  // Moving platforms carry you
  if (player.standingOn && player.standingOn.type === 'moving') {
    player.x += player.standingOn.vx;
  }

  // --- Jumping (coyote time lets you jump just after leaving an edge) ---
  if (jumpPressed) {
    if (player.onGround || player.coyote > 0) {
      // normal jump from the ground
      player.vy = -JUMP_POWER;
      player.onGround = false;
      player.coyote = 0;
      player.standingOn = null;
      player.jumpsUsed = 1;
    } else if (DOUBLE_JUMP && player.jumpsUsed < 2 && player.knockTimer === 0) {
      // double jump in the air!
      player.vy = -DOUBLE_JUMP_POWER;
      player.jumpsUsed = 2;
      makePuffs();
    }
  }
  jumpPressed = false;

  // dust puffs float away
  for (let i = puffs.length - 1; i >= 0; i--) {
    const d = puffs[i];
    d.x += d.vx; d.y += d.vy; d.life--;
    if (d.life <= 0) puffs.splice(i, 1);
  }

  // --- Gravity ---
  player.vy += GRAVITY;
  if (player.vy > 18) player.vy = 18;

  // --- Move ---
  player.x += player.vx;
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > WORLD_WIDTH) player.x = WORLD_WIDTH - player.w;

  const oldBottom = player.y + player.h;
  player.y += player.vy;
  const newBottom = player.y + player.h;

  // --- Landing on platforms (you can jump up through them from below) ---
  let landed = false;
  let landedOn = null;
  if (player.vy >= 0) {
    for (const p of platforms) {
      if (p.broken) continue;
      const overlapsSideways = player.x + player.w > p.x && player.x < p.x + p.w;
      const crossedTop = oldBottom <= p.y + 2 && newBottom >= p.y;
      if (overlapsSideways && crossedTop) {
        player.y = p.y - player.h;
        player.vy = 0;
        landed = true;
        landedOn = p;

        if (p.type === 'bouncy') {
          player.vy = -BOUNCE_POWER;
          player.jumpsUsed = 1;
          p.squish = 12;
          landed = false;
          landedOn = null;
        }
        if (p.type === 'crumble' && p.crumbleTimer === 0) {
          p.crumbleTimer = 1;
        }

        let text = '';
        if (p.type === 'checkpoint' && p.number > checkpoint.number) {
          checkpoint = { x: p.x + p.w / 2 - player.w / 2, y: p.y - player.h, number: p.number };
          text = 'Checkpoint ' + (p.number / CHECKPOINT_EVERY) + '!';
        }
        if (p.zone !== currentZone) {
          currentZone = p.zone;
          text += (text ? ' ' : '') + 'Welcome to ' + ZONES[p.zone].name + '!';
        }
        if (p.type === 'summit' && !won) {
          won = true;
          finishFrames = frames;
          text = 'YOU MADE IT! Time: ' + formatTime(finishFrames);
        }
        if (text) showMessage(text);
        break;
      }
    }
  }

  if (landed) {
    player.onGround = true;
    player.coyote = 6;
    player.standingOn = landedOn;
    player.jumpsUsed = 0;
  } else {
    player.onGround = false;
    player.coyote = Math.max(0, player.coyote - 1);
    if (player.coyote === 0) player.standingOn = null;
  }

  updateEnemies(oldBottom, newBottom);

  // --- Camera follows the player ---
  const target = player.y - H * 0.55;
  cameraY += (target - cameraY) * 0.1;
  const lowestCamera = GROUND_Y + 100 - H;
  if (cameraY > lowestCamera) cameraY = lowestCamera;
  const targetX = player.x + player.w / 2 - W / 2;
  cameraX += (targetX - cameraX) * 0.1;
  if (cameraX < 0) cameraX = 0;
  if (cameraX > WORLD_WIDTH - W) cameraX = WORLD_WIDTH - W;

  // --- Height score ---
  const height = Math.max(0, Math.round((GROUND_Y - player.h - player.y) / 10));
  if (height > bestHeight) bestHeight = height;

  if (messageTimer > 0) messageTimer--;
}

// ============================================================
//  DRAW - paints everything on the screen
// ============================================================
function mixColor(a, b, t) {
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  const r = Math.round(pa[0] + (pb[0] - pa[0]) * t);
  const g = Math.round(pa[1] + (pb[1] - pa[1]) * t);
  const bl = Math.round(pa[2] + (pb[2] - pa[2]) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

function drawPlatform(p, sy) {
  let x = p.x - cameraX;
  if (x + p.w < -20 || x > W + 20) return;
  // Crumbling platforms shake before they break
  if (p.type === 'crumble' && p.crumbleTimer > 0) x += (Math.random() * 4 - 2);

  if (p.type === 'ground') {
    ctx.fillStyle = '#5a3d1e';
    ctx.fillRect(x, sy, p.w, p.h);
    ctx.fillStyle = '#3cb043';
    ctx.fillRect(x, sy, p.w, 12);

  } else if (p.type === 'checkpoint') {
    ctx.fillStyle = '#2d6cdf';
    ctx.fillRect(x, sy, p.w, p.h);
    ctx.fillStyle = '#ddd';
    ctx.fillRect(x + p.w / 2 - 2, sy - 40, 4, 40);
    ctx.fillStyle = p.number <= checkpoint.number ? '#3cb043' : '#ff4757';
    ctx.beginPath();
    ctx.moveTo(x + p.w / 2 + 2, sy - 40);
    ctx.lineTo(x + p.w / 2 + 26, sy - 32);
    ctx.lineTo(x + p.w / 2 + 2, sy - 24);
    ctx.fill();

  } else if (p.type === 'summit') {
    ctx.fillStyle = '#f9c74f';
    ctx.fillRect(x, sy, p.w, p.h);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('THE TOP!', x + p.w / 2, sy - 10);

  } else if (p.type === 'moving') {
    ctx.fillStyle = '#9b5de5';
    ctx.fillRect(x, sy, p.w, p.h);
    ctx.fillStyle = '#f3e8ff';
    // little arrows so you can tell it moves
    ctx.beginPath();
    ctx.moveTo(x + 6, sy + 9); ctx.lineTo(x + 16, sy + 3); ctx.lineTo(x + 16, sy + 15);
    ctx.moveTo(x + p.w - 6, sy + 9); ctx.lineTo(x + p.w - 16, sy + 3); ctx.lineTo(x + p.w - 16, sy + 15);
    ctx.fill();

  } else if (p.type === 'crumble') {
    if (p.broken) {
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.setLineDash([6, 6]);
      ctx.strokeRect(x, sy, p.w, p.h);
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle = '#c47a3a';
      ctx.fillRect(x, sy, p.w, p.h);
      ctx.strokeStyle = '#4a2a0a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let cx = x + 15; cx < x + p.w - 5; cx += 25) {
        ctx.moveTo(cx, sy); ctx.lineTo(cx - 5, sy + 8); ctx.lineTo(cx + 3, sy + p.h);
      }
      ctx.stroke();
      ctx.lineWidth = 1;
    }

  } else if (p.type === 'bouncy') {
    const squish = p.squish > 0 ? 6 : 0;
    ctx.fillStyle = '#f9c74f';
    ctx.fillRect(x, sy + squish, p.w, p.h - squish);
    ctx.fillStyle = '#e63946';
    ctx.fillRect(x, sy + squish, p.w, 6);
    ctx.fillStyle = '#333';
    for (let sx = x + 10; sx < x + p.w - 5; sx += 20) ctx.fillRect(sx, sy + 8 + squish, 4, p.h - 8 - squish);

  } else if (p.type === 'ice') {
    ctx.fillStyle = '#a8e4ff';
    ctx.fillRect(x, sy, p.w, p.h);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x, sy, p.w, 4);
    ctx.fillRect(x + 8, sy + 9, p.w * 0.3, 2);

  } else {
    // a normal platform, which looks different in every zone
    if (p.zone === 0) {            // meadow: dirt and grass
      ctx.fillStyle = '#5a3d1e';
      ctx.fillRect(x, sy, p.w, p.h);
      ctx.fillStyle = '#3cb043';
      ctx.fillRect(x, sy, p.w, 7);
    } else if (p.zone === 1) {     // mountains: stone
      ctx.fillStyle = '#7d838c';
      ctx.fillRect(x, sy, p.w, p.h);
      ctx.fillStyle = '#b0b5bd';
      ctx.fillRect(x, sy, p.w, 5);
      ctx.fillStyle = '#5c616a';
      ctx.fillRect(x + 10, sy + 9, 8, 5);
      ctx.fillRect(x + p.w - 22, sy + 10, 10, 4);
    } else if (p.zone === 2) {     // icy peaks: snowy rock
      ctx.fillStyle = '#7d838c';
      ctx.fillRect(x, sy, p.w, p.h);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x, sy, p.w, 8);
    } else {                       // space: fluffy cloud
      ctx.fillStyle = '#f4f1ff';
      ctx.beginPath();
      ctx.roundRect(x, sy, p.w, p.h, 9);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x + p.w * 0.3, sy + 2, 10, 0, Math.PI * 2);
      ctx.arc(x + p.w * 0.65, sy, 12, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawMountain(m, parallax, color, snowy) {
  const baseY = m.py - cameraY * parallax;
  const baseX = m.x - cameraX * parallax;
  if (baseY - m.h > H || baseY < 0 || baseX + m.w / 2 < 0 || baseX - m.w / 2 > W) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(baseX - m.w / 2, baseY);
  ctx.lineTo(baseX, baseY - m.h);
  ctx.lineTo(baseX + m.w / 2, baseY);
  ctx.fill();
  if (snowy) {
    // white snow cap on top
    const capH = m.h * 0.3;
    const capW = m.w * 0.3;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(baseX - capW / 2, baseY - m.h + capH);
    ctx.lineTo(baseX, baseY - m.h);
    ctx.lineTo(baseX + capW / 2, baseY - m.h + capH);
    ctx.lineTo(baseX + capW / 4, baseY - m.h + capH * 0.8);
    ctx.lineTo(baseX, baseY - m.h + capH * 1.1);
    ctx.lineTo(baseX - capW / 4, baseY - m.h + capH * 0.8);
    ctx.fill();
  }
}

function drawBackground() {
  const y = player.y;
  const meadow = zoneStrength(0, y);
  const mountains = zoneStrength(1, y);
  const icy = zoneStrength(2, y);
  const space = zoneStrength(3, y);

  // Sky
  ctx.fillStyle = skyColorAt(y);
  ctx.fillRect(0, 0, W, H);

  // ---------- OUTER SPACE ----------
  if (space > 0) {
    // twinkling stars
    for (const s of stars) {
      const tw = 0.6 + 0.4 * Math.sin(frames * 0.05 + s.twinkle);
      ctx.fillStyle = 'rgba(255,255,255,' + (space * tw) + ')';
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = space;
    // the moon
    const moonY = moon.py - cameraY * 0.2;
    const moonX = moon.x - cameraX * 0.2;
    ctx.fillStyle = '#e8e6d8';
    ctx.beginPath(); ctx.arc(moonX, moonY, moon.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c9c7b8';
    ctx.beginPath();
    ctx.arc(moonX - 25, moonY - 15, 14, 0, Math.PI * 2);
    ctx.arc(moonX + 20, moonY + 20, 10, 0, Math.PI * 2);
    ctx.arc(moonX + 15, moonY - 30, 7, 0, Math.PI * 2);
    ctx.fill();
    // a ringed planet
    const planetY = planet.py - cameraY * 0.3;
    const planetX = planet.x - cameraX * 0.3;
    ctx.fillStyle = '#e07a5f';
    ctx.beginPath(); ctx.arc(planetX, planetY, planet.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#f2cc8f';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.ellipse(planetX, planetY, planet.r * 1.8, planet.r * 0.45, -0.3, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1;
    // a rocket flying past
    rocket.x += rocket.speed;
    if (rocket.x > W + 100) { rocket.x = -100; rocket.y = 80 + Math.random() * 350; }
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(rocket.x + 30, rocket.y);
    ctx.lineTo(rocket.x + 10, rocket.y - 8);
    ctx.lineTo(rocket.x - 15, rocket.y - 8);
    ctx.lineTo(rocket.x - 15, rocket.y + 8);
    ctx.lineTo(rocket.x + 10, rocket.y + 8);
    ctx.fill();
    ctx.fillStyle = '#e63946';
    ctx.fillRect(rocket.x - 20, rocket.y - 14, 8, 28);
    ctx.fillStyle = '#ffb703';
    ctx.beginPath();
    ctx.moveTo(rocket.x - 20, rocket.y - 5);
    ctx.lineTo(rocket.x - 38 - Math.random() * 10, rocket.y);
    ctx.lineTo(rocket.x - 20, rocket.y + 5);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ---------- THE MEADOW ----------
  if (meadow > 0) {
    ctx.globalAlpha = meadow;
    // the sun
    ctx.fillStyle = '#ffd93d';
    ctx.beginPath(); ctx.arc(W - 90, 80, 38, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,217,61,0.6)';
    ctx.lineWidth = 3;
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + frames * 0.005;
      ctx.beginPath();
      ctx.moveTo(W - 90 + Math.cos(a) * 46, 80 + Math.sin(a) * 46);
      ctx.lineTo(W - 90 + Math.cos(a) * 60, 80 + Math.sin(a) * 60);
      ctx.stroke();
    }
    ctx.lineWidth = 1;
    // trees
    for (const t of trees) {
      const sy = t.py - cameraY * 0.5;
      const sx = t.x - cameraX * 0.5;
      if (sy < -80 || sy > H + 80 || sx < -60 || sx > W + 60) continue;
      ctx.fillStyle = '#6d4c41';
      ctx.fillRect(sx - 4, sy - t.size, 8, t.size);
      ctx.fillStyle = '#2e7d32';
      ctx.beginPath(); ctx.arc(sx, sy - t.size, t.size * 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#43a047';
      ctx.beginPath(); ctx.arc(sx - t.size * 0.2, sy - t.size - t.size * 0.2, t.size * 0.4, 0, Math.PI * 2); ctx.fill();
    }
    // rolling hills
    for (const h of hills) {
      const sy = h.py - cameraY * 0.8;
      const sx = h.x - cameraX * 0.8;
      if (sy - h.r > H || sx + h.r < 0 || sx - h.r > W) continue;
      ctx.fillStyle = h.color;
      ctx.beginPath(); ctx.arc(sx, sy, h.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- THE MOUNTAINS ----------
  if (mountains > 0) {
    ctx.globalAlpha = mountains;
    for (const m of farMountains) drawMountain(m, 0.3, '#3d4a5c', false);
    for (const m of nearMountains) drawMountain(m, 0.5, '#55657a', false);
    // birds
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2;
    for (const b of birds) {
      b.x += b.speed;
      if (b.x > W + 20) { b.x = -20; b.y = 60 + Math.random() * 400; }
      const flap = Math.sin(frames * 0.15 + b.flap) * 4;
      ctx.beginPath();
      ctx.moveTo(b.x - 8, b.y - flap);
      ctx.lineTo(b.x, b.y);
      ctx.lineTo(b.x + 8, b.y - flap);
      ctx.stroke();
    }
    ctx.lineWidth = 1;
    ctx.globalAlpha = 1;
  }

  // ---------- THE ICY PEAKS ----------
  if (icy > 0) {
    ctx.globalAlpha = icy;
    for (const m of snowyPeaks) drawMountain(m, 0.4, '#8fa3b8', true);
    // falling snow
    ctx.fillStyle = '#ffffff';
    for (const f of snowflakes) {
      f.y += f.speed;
      f.x += Math.sin(frames * 0.02 + f.wobble) * 0.5;
      if (f.y > H) { f.y = -5; f.x = Math.random() * W; }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- CLOUDS (meadow, mountains and icy peaks) ----------
  ctx.fillStyle = 'rgba(255,255,255,' + (0.75 * (1 - space)) + ')';
  for (const c of clouds) {
    const sy = c.py - cameraY * 0.6;
    const sx = c.x - cameraX * 0.6;
    if (sy < -60 || sy > H + 60 || sx < -80 || sx > W + 80) continue;
    ctx.beginPath();
    ctx.arc(sx, sy, c.size * 0.5, 0, Math.PI * 2);
    ctx.arc(sx + c.size * 0.4, sy - c.size * 0.1, c.size * 0.4, 0, Math.PI * 2);
    ctx.arc(sx - c.size * 0.4, sy + c.size * 0.05, c.size * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ============================================================
//  THE MOUNTAIN CLIMBER
// ============================================================
function drawClimber(px, py) {
  if (player.hurtTimer > 0 && Math.floor(frames / 4) % 2 === 0) return; // blink after a hit
  const running = player.onGround && Math.abs(player.vx) > 0.5;
  const inAir = !player.onGround;
  const step = running ? Math.sin(frames * 0.35) * 5 : 0; // legs swing while running

  ctx.save();
  ctx.translate(px + player.w / 2, py);   // middle-top of the player
  ctx.scale(player.facing, 1);            // flip to face left or right

  // Backpack (on the back)
  ctx.fillStyle = '#5c4a3a';
  ctx.beginPath(); ctx.roundRect(-18, 14, 10, 18, 3); ctx.fill();
  // coiled rope on the backpack
  ctx.strokeStyle = '#f4d35e';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(-13, 22, 4, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(-13, 22, 2, 0, Math.PI * 2); ctx.stroke();

  // Legs and boots
  ctx.fillStyle = '#3b4a6b'; // pants
  ctx.fillRect(-7 + (inAir ? -3 : step), 30, 6, 7);
  ctx.fillRect(1 + (inAir ? 3 : -step), 30, 6, 7);
  ctx.fillStyle = '#4a2c17'; // boots
  ctx.fillRect(-8 + (inAir ? -3 : step), 36, 8, 4);
  ctx.fillRect(0 + (inAir ? 3 : -step), 36, 8, 4);

  // Jacket
  ctx.fillStyle = PLAYER_COLOR;
  ctx.beginPath(); ctx.roundRect(-10, 17, 20, 15, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; // zipper
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, 31); ctx.stroke();

  // Arm and ice axe (in front)
  ctx.fillStyle = PLAYER_COLOR;
  const armLift = inAir ? -8 : 0;
  ctx.beginPath(); ctx.roundRect(6, 19 + armLift, 5, 11, 2); ctx.fill();
  ctx.fillStyle = '#8d6e63'; // axe handle
  ctx.fillRect(9, 12 + armLift, 3, 20);
  ctx.fillStyle = '#cfd8dc'; // axe head
  ctx.beginPath();
  ctx.moveTo(6, 12 + armLift); ctx.lineTo(18, 12 + armLift); ctx.lineTo(17, 15 + armLift); ctx.lineTo(8, 16 + armLift);
  ctx.fill();

  // Face
  ctx.fillStyle = '#f1c27d';
  ctx.beginPath(); ctx.roundRect(-8, 7, 16, 11, 4); ctx.fill();
  ctx.fillStyle = '#222'; // eye
  ctx.beginPath(); ctx.arc(4, 12, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#222'; // smile
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(3, 14, 3, 0.2, Math.PI - 0.6); ctx.stroke();

  // Helmet
  ctx.fillStyle = '#e63946';
  ctx.beginPath(); ctx.arc(0, 8, 10, Math.PI, 0); ctx.fill();
  ctx.fillRect(-10, 7, 20, 2);
  ctx.fillStyle = '#ffd93d'; // headlamp
  ctx.fillRect(5, 3, 5, 4);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; // shine
  ctx.beginPath(); ctx.arc(-4, 3, 2.5, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
  ctx.lineWidth = 1;
}

function draw() {
  drawBackground();

  // Platforms
  for (const p of platforms) {
    const sy = p.y - cameraY;
    if (sy < -50 || sy > H + 50) continue;
    drawPlatform(p, sy);
  }

  // Animals and aliens
  drawEnemies();

  // Dust puffs
  for (const d of puffs) {
    ctx.fillStyle = 'rgba(255,255,255,' + (d.life / 20) * 0.8 + ')';
    ctx.beginPath(); ctx.arc(d.x - cameraX, d.y - cameraY, d.size, 0, Math.PI * 2); ctx.fill();
  }

  // Player
  drawClimber(player.x - cameraX, player.y - cameraY);

  // Score board
  const height = Math.max(0, Math.round((GROUND_Y - player.h - player.y) / 10));
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(10, 10, 200, 102);
  ctx.fillStyle = 'white';
  ctx.font = '18px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('Height: ' + height + ' m', 20, 34);
  ctx.fillText('Best: ' + bestHeight + ' m', 20, 58);
  ctx.fillText('Checkpoint: ' + (checkpoint.number / CHECKPOINT_EVERY), 20, 82);
  ctx.fillText('Time: ' + formatTime(won ? finishFrames : frames), 20, 106);

  // Zone name
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W - 190, 10, 180, 34);
  ctx.fillStyle = 'white';
  ctx.fillText(ZONES[zoneAt(player.y)].name, W - 20, 34);

  // Messages
  if (messageTimer > 0) {
    ctx.font = 'bold 28px Arial';
    const textWidth = ctx.measureText(message).width;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(W / 2 - textWidth / 2 - 20, 120, textWidth + 40, 56);
    ctx.fillStyle = '#ffe066';
    ctx.textAlign = 'center';
    ctx.fillText(message, W / 2, 158);
  }

  // Start screen
  if (!started) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.font = 'bold 44px Arial';
    ctx.fillText("Don't Look Down", W / 2, H / 2 - 50);
    ctx.font = '22px Arial';
    ctx.fillText('Climb to the top! Press any key to start.', W / 2, H / 2);
    ctx.font = '17px Arial';
    ctx.fillStyle = '#ccc';
    ctx.fillText('Purple = moving   Orange = crumbles   Yellow/red = bouncy   Light blue = slippery ice', W / 2, H / 2 + 40);
    ctx.fillText('Jump on goats, birds and aliens to bonk them. Stay away from bears!', W / 2, H / 2 + 66);
  }
}

// ============================================================
//  GAME LOOP
// ============================================================
function loop() {
  if (started) update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
