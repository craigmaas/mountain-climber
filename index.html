<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Don't Look Down</title>
<style>
  body {
    margin: 0;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
  }
  h1 { margin: 10px 0 4px; }
  p { margin: 0 0 10px; color: #bbb; }
  canvas { border: 4px solid #333; border-radius: 8px; }
</style>
</head>
<body>
<h1>Don't Look Down</h1>
<p>Arrow keys or A / D to move &nbsp;•&nbsp; Space or Up to jump &nbsp;•&nbsp; R to go back to your checkpoint</p>
<canvas id="game" width="800" height="600"></canvas>

<script>
// ============================================================
//  SETTINGS - change these numbers to change how the game feels!
// ============================================================
const GRAVITY = 0.6;            // how fast you fall
const JUMP_POWER = 13;          // how high you jump
const RUN_SPEED = 5;            // how fast you run
const NUMBER_OF_PLATFORMS = 80; // how many platforms to the top
const CHECKPOINT_EVERY = 10;    // a checkpoint every this many platforms
const PLAYER_COLOR = '#ff6b6b'; // the color of your character
const LEVEL_NUMBER = 1;         // change this to get a brand new tower!

// A "random" number maker that gives the same numbers for the same level number
let seed = LEVEL_NUMBER * 9999 + 12345;
function random() {
  seed = (seed * 1664525 + 1013904223) % 4294967296;
  return seed / 4294967296;
}

// ============================================================
//  SETUP
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const GROUND_Y = 500; // where the ground is

// Keyboard
const keys = {};
let jumpPressed = false;
let started = false;

window.addEventListener('keydown', function (e) {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  if (!keys[e.key] && (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W')) {
    jumpPressed = true;
  }
  keys[e.key] = true;
  if (e.key === 'r' || e.key === 'R') respawn();
  started = true;
});
window.addEventListener('keyup', function (e) { keys[e.key] = false; });

// ============================================================
//  BUILD THE PLATFORMS (the tower you climb)
// ============================================================
const platforms = [];
platforms.push({ x: 0, y: GROUND_Y, w: W, h: 100, type: 'ground', number: 0 });

let lastCenter = W / 2;
let lastWidth = W;
for (let i = 1; i <= NUMBER_OF_PLATFORMS; i++) {
  const isSummit = i === NUMBER_OF_PLATFORMS;
  const isCheckpoint = !isSummit && i % CHECKPOINT_EVERY === 0;

  let w;
  if (isSummit) w = 260;
  else if (isCheckpoint) w = 180;
  else w = 90 + random() * 80;

  // Pick a spot that is always possible to jump to
  const MAX_GAP = 100; // biggest empty space between two platforms
  let cx = lastCenter + (random() * 2 - 1) * 220;
  cx = Math.max(w / 2 + 10, Math.min(W - w / 2 - 10, cx));
  const gap = Math.abs(cx - lastCenter) - w / 2 - lastWidth / 2;
  if (gap > MAX_GAP) {
    const direction = cx > lastCenter ? 1 : -1;
    cx = lastCenter + direction * (MAX_GAP + w / 2 + lastWidth / 2);
    cx = Math.max(w / 2 + 10, Math.min(W - w / 2 - 10, cx));
  }
  const y = GROUND_Y - i * 85 + (random() * 20 - 10);

  let type = 'normal';
  if (isSummit) type = 'summit';
  else if (isCheckpoint) type = 'checkpoint';

  platforms.push({ x: cx - w / 2, y: y, w: w, h: 18, type: type, number: i });
  lastCenter = cx;
  lastWidth = w;
}

// Clouds in the background
const clouds = [];
for (let i = 0; i < 60; i++) {
  clouds.push({ x: random() * W, y: GROUND_Y - random() * NUMBER_OF_PLATFORMS * 85, size: 30 + random() * 40 });
}

// ============================================================
//  THE PLAYER
// ============================================================
const player = { x: W / 2 - 16, y: GROUND_Y - 40, w: 32, h: 40, vx: 0, vy: 0, onGround: false, coyote: 0, facing: 1 };
let checkpoint = { x: player.x, y: player.y, number: 0 };
let cameraY = GROUND_Y + 100 - H;
let bestHeight = 0;
let won = false;
let message = '';
let messageTimer = 0;

function showMessage(text) {
  message = text;
  messageTimer = 120;
}

function respawn() {
  player.x = checkpoint.x;
  player.y = checkpoint.y;
  player.vx = 0;
  player.vy = 0;
  showMessage('Back to your checkpoint!');
}

// ============================================================
//  UPDATE - runs 60 times every second
// ============================================================
function update() {
  // Running left and right
  let move = 0;
  if (keys.ArrowLeft || keys.a || keys.A) move -= 1;
  if (keys.ArrowRight || keys.d || keys.D) move += 1;
  player.vx = move * RUN_SPEED;
  if (move !== 0) player.facing = move;

  // Jumping (coyote time lets you jump just after leaving an edge)
  if (jumpPressed && (player.onGround || player.coyote > 0)) {
    player.vy = -JUMP_POWER;
    player.onGround = false;
    player.coyote = 0;
  }
  jumpPressed = false;

  // Gravity
  player.vy += GRAVITY;
  if (player.vy > 18) player.vy = 18;

  // Move
  player.x += player.vx;
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > W) player.x = W - player.w;

  const oldBottom = player.y + player.h;
  player.y += player.vy;
  const newBottom = player.y + player.h;

  // Landing on platforms (you can jump up through them from below)
  let landed = false;
  if (player.vy >= 0) {
    for (const p of platforms) {
      const overlapsSideways = player.x + player.w > p.x && player.x < p.x + p.w;
      const crossedTop = oldBottom <= p.y && newBottom >= p.y;
      if (overlapsSideways && crossedTop) {
        player.y = p.y - player.h;
        player.vy = 0;
        landed = true;

        if (p.type === 'checkpoint' && p.number > checkpoint.number) {
          checkpoint = { x: p.x + p.w / 2 - player.w / 2, y: p.y - player.h, number: p.number };
          showMessage('Checkpoint ' + (p.number / CHECKPOINT_EVERY) + '!');
        }
        if (p.type === 'summit' && !won) {
          won = true;
          showMessage('YOU MADE IT TO THE TOP!');
        }
        break;
      }
    }
  }

  if (landed) {
    player.onGround = true;
    player.coyote = 6;
  } else {
    player.onGround = false;
    player.coyote = Math.max(0, player.coyote - 1);
  }

  // Camera follows the player
  const target = player.y - H * 0.55;
  cameraY += (target - cameraY) * 0.1;
  const lowestCamera = GROUND_Y + 100 - H;
  if (cameraY > lowestCamera) cameraY = lowestCamera;

  // Height score
  const height = Math.max(0, Math.round((GROUND_Y - player.h - player.y) / 10));
  if (height > bestHeight) bestHeight = height;

  if (messageTimer > 0) messageTimer--;
}

// ============================================================
//  DRAW - paints everything on the screen
// ============================================================
function mixColor(a, b, t) {
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  const r = Math.round(pa[0] + (pb[0] - pa[0]) * t);
  const g = Math.round(pa[1] + (pb[1] - pa[1]) * t);
  const bl = Math.round(pa[2] + (pb[2] - pa[2]) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

function draw() {
  // Sky gets darker the higher you go
  const howHigh = Math.min(1, Math.max(0, (GROUND_Y - player.y) / (NUMBER_OF_PLATFORMS * 85)));
  ctx.fillStyle = mixColor('#87ceeb', '#0b0b3b', howHigh);
  ctx.fillRect(0, 0, W, H);

  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (const c of clouds) {
    const sy = c.y - cameraY * 0.6;
    if (sy < -60 || sy > H + 60) continue;
    ctx.beginPath();
    ctx.arc(c.x, sy, c.size * 0.5, 0, Math.PI * 2);
    ctx.arc(c.x + c.size * 0.4, sy - c.size * 0.1, c.size * 0.4, 0, Math.PI * 2);
    ctx.arc(c.x - c.size * 0.4, sy + c.size * 0.05, c.size * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }

  // Platforms
  for (const p of platforms) {
    const sy = p.y - cameraY;
    if (sy < -40 || sy > H + 40) continue;

    if (p.type === 'ground') {
      ctx.fillStyle = '#5a3d1e';
      ctx.fillRect(p.x, sy, p.w, p.h);
      ctx.fillStyle = '#3cb043';
      ctx.fillRect(p.x, sy, p.w, 12);
    } else if (p.type === 'checkpoint') {
      ctx.fillStyle = '#2d6cdf';
      ctx.fillRect(p.x, sy, p.w, p.h);
      // flag
      ctx.fillStyle = '#ddd';
      ctx.fillRect(p.x + p.w / 2 - 2, sy - 40, 4, 40);
      ctx.fillStyle = p.number <= checkpoint.number ? '#3cb043' : '#ff4757';
      ctx.beginPath();
      ctx.moveTo(p.x + p.w / 2 + 2, sy - 40);
      ctx.lineTo(p.x + p.w / 2 + 26, sy - 32);
      ctx.lineTo(p.x + p.w / 2 + 2, sy - 24);
      ctx.fill();
    } else if (p.type === 'summit') {
      ctx.fillStyle = '#f9c74f';
      ctx.fillRect(p.x, sy, p.w, p.h);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('THE TOP!', p.x + p.w / 2, sy - 10);
    } else {
      ctx.fillStyle = '#5a3d1e';
      ctx.fillRect(p.x, sy, p.w, p.h);
      ctx.fillStyle = '#3cb043';
      ctx.fillRect(p.x, sy, p.w, 7);
    }
  }

  // Player
  const px = player.x;
  const py = player.y - cameraY;
  ctx.fillStyle = PLAYER_COLOR;
  ctx.beginPath();
  ctx.roundRect(px, py, player.w, player.h, 10);
  ctx.fill();
  // eyes
  const eyeX = px + player.w / 2 + player.facing * 6;
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(eyeX - 6, py + 14, 5, 0, Math.PI * 2);
  ctx.arc(eyeX + 6, py + 14, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'black';
  ctx.beginPath();
  ctx.arc(eyeX - 6 + player.facing * 2, py + 14, 2.5, 0, Math.PI * 2);
  ctx.arc(eyeX + 6 + player.facing * 2, py + 14, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Score board
  const height = Math.max(0, Math.round((GROUND_Y - player.h - player.y) / 10));
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(10, 10, 190, 78);
  ctx.fillStyle = 'white';
  ctx.font = '18px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('Height: ' + height + ' m', 20, 34);
  ctx.fillText('Best: ' + bestHeight + ' m', 20, 58);
  ctx.fillText('Checkpoint: ' + (checkpoint.number / CHECKPOINT_EVERY), 20, 82);

  // Messages
  if (messageTimer > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(W / 2 - 220, 110, 440, 60);
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 30px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(message, W / 2, 152);
  }

  // Start screen
  if (!started) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.font = 'bold 44px Arial';
    ctx.fillText("Don't Look Down", W / 2, H / 2 - 30);
    ctx.font = '22px Arial';
    ctx.fillText('Climb to the top! Press any key to start.', W / 2, H / 2 + 20);
  }
}

// ============================================================
//  GAME LOOP
// ============================================================
function loop() {
  if (started) update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
